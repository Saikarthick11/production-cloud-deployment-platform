apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloud-platform
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [cloud-platform-gitops]
  selector:
    matchLabels:
      app.kubernetes.io/instance: cloud-platform-gitops
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
